services:
  - type: web
    name: neuropipe-sabv
    runtime: docker
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"

